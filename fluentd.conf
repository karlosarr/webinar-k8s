<source>
  @type tail
  path /var/log/nginx/access.log
  tag nginx.access
  pos_file /fluentd/pos/access.log
  <parse>
    @type regexp
    expression /^(?<host>\S) \S+ \S+ \[(?<time>[^\]]+)\] "(?<method>\S+) (?<path>\S+) (?<proto>[^"]+)" (?<status>\d+) (?<size>\d+) "(?<referer>[^"]*)" "(?<user_agent>.*)"$
  </parse>
</source>
<match nginx.access>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix nginx
  flush 5s
</match>
<match **>
  @type stdout
</match>